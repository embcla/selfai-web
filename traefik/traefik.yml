# Global configuration
global:
  checkNewVersion: true
  sendAnonymousUsage: false

# API and Dashboard configuration
api:
  dashboard: true
  insecure: false  # Set to true only for testing

# Entrypoints configuration
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http3: {}  # Enable HTTP/3


# Providers configuration
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    watch: true
    exposedByDefault: false
    network: selfai
    # Enable Docker provider v2 API
    useBindPortIP: true
    # Enable container labels
    allowEmptyServices: true
  file:
    directory: "/config"
    watch: true

# Certificate resolvers
certificatesResolvers:
  letsencrypt:
    acme:
      email: "claude.carbone@gmail.com"
      storage: /certs/acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory # prod (default)
      #caServer: https://acme-staging-v02.api.letsencrypt.org/directory # staging
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 10
        #resolvers:
        #  - "1.1.1.1:53"
        #  - "8.8.8.8:53"

# Logging configuration
log:
  level: DEBUG  # Changed from INFO to DEBUG  # DEBUG, INFO, WARN, ERROR, FATAL, PANIC
