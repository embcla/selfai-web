services:
  traefik:
    image: traefik:v3.4.1
    container_name: traefik
    ports:
      - "80:80"      # HTTP
      - "443:443"    # HTTPS
      - "443:443/udp" # HTTP/3 (QUIC)
      #- "8080:8080"  # Dashboard & Metrics
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./certs:/certs
      - ./config:/config
      - ./logs:/var/log
    networks:
      - selfai

    #secrets:
    #  - source: cf_api_email
    #    target: /run/secrets/cf_api_email
    #  - source: cf_api_key
    #    target: /run/secrets/cf_api_key
    #environment:
    #  - "CF_API_EMAIL_FILE=/run/secrets/cf_api_email"
    #  - "CF_DNS_API_TOKEN_FILE=/run/secrets/cf_api_key"

    environment:
      - "CF_API_EMAIL=email@example.com"
      - "CF_DNS_API_TOKEN=token"
    labels:
      - "traefik.enable=true"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.traefik-http.entrypoints=web"
      - "traefik.http.routers.traefik-http.rule=Host(`trfk.meco.cfd`)"
      - "traefik.http.routers.traefik-http.middlewares=https-redirect@file"
      # HTTPS Dashboard with auth
      - "traefik.http.routers.traefik-dashboard.rule=Host(`trfk.meco.cfd`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.tls.certResolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth@file,rate-limit@file"
      #- "traefik.http.middlewares.traefik-auth.basicauth.users=trfkadm:password123" # Generate with htpasswd      
      ## Dashboard configuration
      ##- "traefik.http.routers.dashboard.rule=Host(`trfk.meco.cfd`)"
      ##- "traefik.http.routers.dashboard.service=api@internal"
      ##- "traefik.http.routers.dashboard.middlewares=auth"
      ##- "traefik.http.middlewares.auth.basicauth.users=admin:password123" # Generate with htpasswd
      ### Metrics configuration
      ##- "traefik.http.routers.metrics.rule=Host(`traefik.yourdomain.com`) && PathPrefix(`/metrics`)"
      ##- "traefik.http.routers.metrics.service=prometheus@internal"
      #- "traefik.http.routers.metrics.middlewares=auth"

  hello-world-1:
    #build:
      #context: ./hello-world
      #dockerfile: Dockerfile
    image: traefik/whoami
    container_name: hello-world-1
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - selfai
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hello1.rule=Host(`sub1.meco.cfd`)"
      - "traefik.http.routers.hello1.entrypoints=websecure"
      - "traefik.http.routers.hello1.tls=true"
      - "traefik.http.routers.hello1.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hello1.middlewares=rate-limit@file"
      - "traefik.http.routers.hello1.middlewares=https-redirect@file"
      - "traefik.http.services.hello1.loadbalancer.server.port=80"

  hello-world-2:
    #build:
      #context: ./hello-world
      #dockerfile: Dockerfile
    image: traefik/whoami
    container_name: hello-world-2
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - selfai
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hello2.rule=Host(`sub2.meco.cfd`)"
      - "traefik.http.routers.hello2.entrypoints=websecure"
      - "traefik.http.routers.hello2.tls=true"
      - "traefik.http.routers.hello2.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hello2.middlewares=rate-limit@file"
      - "traefik.http.routers.hello2.middlewares=https-redirect@file"
      - "traefik.http.services.hello2.loadbalancer.server.port=80"

networks:
  host:
    external: true
  selfai:
    external: true

secrets:
  cf_api_email:
    external: true
  cf_api_key:
    external: true